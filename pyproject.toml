[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visiflow"
version = "0.8.0"
description = "A fast, local, visual-driven E2E automation testing plugin for Playwright and Selenium powered by YOLO and OCR."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Image Recognition"
]
dependencies = [
    "ultralytics>=8.0.0",
    "easyocr>=1.7.0",
    "opencv-python-headless>=4.0.0",
    "numpy>=1.20.0",
    "pillow>=9.0.0"
]

[project.optional-dependencies]
playwright = ["playwright>=1.30.0"]
selenium = ["selenium>=4.0.0"]

[project.urls]
Homepage = "https://github.com/yourusername/VisiFlow"
Issues = "https://github.com/yourusername/VisiFlow/issues"

[project.scripts]
visiflow = "visiflow.cli:main"
