<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-blue: #38bdf8;
            --accent-emerald: #34d399;
            --accent-pink: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-width: 280px;
            width: 100%;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 14px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.15rem;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: var(--accent-pink);
            background: rgba(244, 63, 94, 0.1);
        }

        .status-badge.connected {
            border-color: rgba(52, 211, 153, 0.3);
            color: var(--accent-emerald);
            background: rgba(52, 211, 153, 0.1);
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-pink);
        }

        .status-badge.connected .dot {
            background: var(--accent-emerald);
        }

        .btn {
            width: 100%;
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 12px;
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-scan {
            background: linear-gradient(135deg, #38bdf8, #2563eb);
        }

        .btn-scan:hover { opacity: 0.9; }
        .btn-scan:active { transform: scale(0.98); }

        .btn-secondary {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-secondary:hover { background: rgba(15, 23, 42, 0.8); }

        .config-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }

        select {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 6px;
            padding: 6px 10px;
            outline: none;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            height: 160px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            font-family: "Courier New", monospace;
            font-size: 0.75rem;
            color: #34d399;
            resize: none;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 12px;
        }

        .actions-group {
            display: flex;
            gap: 10px;
        }

        .actions-group .btn {
            margin-bottom: 0;
            padding: 8px 12px;
            font-size: 0.8rem;
        }

        .footer-text {
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 14px;
        }

        .loader {
            display: none;
            border: 2px solid rgba(255,255,255,0.1);
            border-left-color: var(--accent-blue);
            width: 14px;
            height: 14px;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .step-row {
            display: flex;
            gap: 6px;
            align-items: center;
            background: rgba(30, 41, 59, 0.4);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .step-num {
            font-size: 0.75rem;
            color: var(--text-muted);
            width: 14px;
            text-align: center;
            font-weight: bold;
        }

        .step-select {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            color: white;
            font-size: 0.75rem;
            padding: 4px 6px;
            border-radius: 4px;
            outline: none;
            width: 65px;
            cursor: pointer;
        }

        .step-input {
            flex: 1;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            color: white;
            font-size: 0.75rem;
            padding: 4px 6px;
            border-radius: 4px;
            outline: none;
            min-width: 60px;
        }

        .step-btn-del {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: var(--accent-pink);
            border-radius: 4px;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .step-btn-del:hover {
            background: rgba(244, 63, 94, 0.3);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">👁️ VisiFlow Recorder</div>
        <div id="status" class="status-badge">
            <span class="dot"></span>
            <span id="status-text">Checking Local...</span>
        </div>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 12px;">
        <button id="scan-btn" class="btn btn-scan" style="flex: 2; margin-bottom: 0;">
            <span class="loader" id="scan-loader"></span>
            <span>📸 Scan Elements</span>
        </button>
        <button id="hide-overlays-btn" class="btn btn-secondary" style="flex: 1; margin-bottom: 0; padding: 10px 14px; font-size: 0.82rem; white-space: nowrap;">👁️ Hide Boxes</button>
    </div>

    <div style="font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--text-muted);">📝 Steps Editor:</div>
    <div id="steps-list" style="margin-bottom: 14px; max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: rgba(15,23,42,0.2); padding: 8px; border-radius: 8px; border: 1px solid var(--border-color);">
        <div style="color: var(--text-muted); font-size: 0.78rem; text-align: center; padding: 12px 0;">No steps recorded. Scan page and click overlays to add steps.</div>
    </div>

    <div class="config-row">
        <label>Language:</label>
        <select id="lang-select">
            <option value="python_playwright">Python + Playwright</option>
            <option value="python_selenium">Python + Selenium</option>
            <option value="js_playwright">Node.js + Playwright</option>
        </select>
    </div>

    <textarea id="script-box" readonly placeholder="// Click 'Scan Web Elements' and click on the overlay boxes on your webpage to record actions..."></textarea>

    <div class="actions-group">
        <button id="run-btn" class="btn btn-scan" style="margin-bottom: 0; padding: 8px 12px; font-size: 0.8rem; background: linear-gradient(135deg, #10b981, #059669); flex: 1;">▶️ Run Script</button>
        <button id="copy-btn" class="btn btn-secondary" style="flex: 1;">📋 Copy</button>
        <button id="clear-btn" class="btn btn-secondary" style="background: rgba(244, 63, 94, 0.15); border-color: rgba(244, 63, 94, 0.3); color: var(--accent-pink); flex: 1;">❌ Clear</button>
    </div>

    <div class="footer-text">
        Ensure <code>visiflow server</code> is running locally on port 8000
    </div>

    <script src="popup.js"></script>
</body>
</html>
