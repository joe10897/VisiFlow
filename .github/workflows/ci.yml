name: VisiFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install playwright pyyaml
          playwright install chromium

      - name: Run MCP & Runner Unit Tests
        run: |
          python tests/test_mcp.py
          python tests/test_runner.py
          python tests/test_desktop.py

      - name: Run Spatial Locators Integration Test
        run: |
          python tests/test_spatial_locators.py

      - name: Run Visual Assertions & HTML Report Test
        run: |
          python tests/test_assertions_and_report.py

      - name: Run Declarative YAML Runner CLI Test
        run: |
          python -m visiflow run tests/sample_test.yaml --headless

  test-nodejs:
    name: Node.js Bindings Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Verify package structure
        working-directory: ./bindings/nodejs
        run: |
          npm install
          node -e "const { VisiPage } = require('./index.js'); console.log('VisiPage successfully loaded');"
