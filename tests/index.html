<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisiFlow Test Automation Page</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --success-color: #10b981;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            margin-bottom: 10px;
            color: #60a5fa;
        }
        p {
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        input[type="text"], input[type="password"] {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: var(--accent-color);
        }
        button {
            padding: 12px;
            background-color: var(--accent-color);
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        .header-actions {
            display: flex;
            justify-content: flex-end;
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
        }
        .cart-btn {
            background-color: #334155;
            padding: 10px 15px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid #475569;
        }
        .cart-btn:hover {
            background-color: #475569;
        }
        .alert {
            display: none;
            padding: 12px;
            background-color: var(--success-color);
            color: white;
            border-radius: 6px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-sizing: border-box;
            font-weight: 600;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        .action-btn {
            padding: 6px 12px;
            font-size: 0.85rem;
            margin-right: 6px;
        }
        .del-btn {
            background-color: #ef4444;
        }
        .del-btn:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <h1>VisiFlow Testing Ground</h1>
    <p>A visual testing mock application for YOLO and OCR detection</p>

    <!-- Success Alerts -->
    <div id="login-alert" class="alert">Logged in successfully!</div>
    <div id="cart-alert" class="alert">Added item to shopping cart!</div>
    <div id="alice-del-alert" class="alert">Deleted user Alice Smith!</div>
    <div id="bob-del-alert" class="alert">Deleted user Bob Jones!</div>
    <div id="bob-edit-alert" class="alert">Editing user Bob Jones!</div>

    <div class="header-actions">
        <div id="cart-btn" class="cart-btn" onclick="triggerAlert('cart-alert')">
            <span>🛒</span>
            <span>Shopping Cart</span>
        </div>
    </div>

    <div class="container">
        <h2 style="margin-top: 0; color: #cbd5e1;">Developer Login</h2>
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter your username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>
        <button id="submit-btn" style="width: 100%;" onclick="triggerAlert('login-alert')">Submit</button>
    </div>

    <div class="container">
        <h2 style="margin-top: 0; color: #cbd5e1;">User Management</h2>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Alice Smith</td>
                    <td>
                        <button class="action-btn" onclick="triggerAlert('alice-del-alert')">Delete</button>
                    </td>
                </tr>
                <tr>
                    <td>Bob Jones</td>
                    <td>
                        <button class="action-btn" onclick="triggerAlert('bob-edit-alert')">Edit</button>
                        <button class="action-btn del-btn" onclick="triggerAlert('bob-del-alert')">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        function triggerAlert(id) {
            const alert = document.getElementById(id);
            alert.style.display = 'block';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
